  <g font-size="14.5">
    <rect x="62" y="226" width="108" height="34" rx="17" fill="#1f2b3d"/><text x="86" y="248" fill="#79b0f8" font-weight="600">目录 OCR</text>
    <rect x="182" y="226" width="108" height="34" rx="17" fill="#1f2b3d"/><text x="200" y="248" fill="#79b0f8" font-weight="600">秒级重扫</text>
    <rect x="302" y="226" width="108" height="34" rx="17" fill="#1f2b3d"/><text x="320" y="248" fill="#79b0f8" font-weight="600">项目隔离</text>
    <rect x="62" y="272" width="108" height="34" rx="17" fill="#1f2b3d"/><text x="92" y="294" fill="#79b0f8" font-weight="600">DWG 支持</text>
    <rect x="182" y="272" width="108" height="34" rx="17" fill="#1f2b3d"/><text x="206" y="294" fill="#79b0f8" font-weight="600">双主题</text>
