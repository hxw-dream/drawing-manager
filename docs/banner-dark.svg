  <text x="64" y="352" font-size="15" fill="#9198a1">只读索引，绝不改动图纸文件 · 仅监听本机 · 绿色免安装</text>
  <text x="64" y="382" font-size="14" fill="#65707e">36 项自动化测试 · GitHub Actions CI · v2.4</text>

