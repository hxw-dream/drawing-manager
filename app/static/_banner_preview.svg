<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <clipPath id="win-clip"><rect x="616" y="52" width="528" height="332" rx="10"/></clipPath>
  </defs>
  <!-- 背景 -->
  <rect width="1200" height="420" fill="#f3f5f8"/>
  <rect x="0" y="0" width="1200" height="6" fill="#0b5cd5"/>
  <!-- 左列：标题与卖点 -->
  <text x="64" y="86" font-size="17" fill="#0b5cd5" font-weight="600">本地 · 离线 · 隐私优先</text>
  <text x="62" y="146" font-size="42" font-weight="700" fill="#1a2533">工程图纸文件管理系统</text>
  <text x="64" y="192" font-size="20" fill="#5c6b7f">识别每册目录 · 秒级全文检索 · 版本对比 · 清册导出</text>
  <!-- 特性徽章 -->
  <g font-size="14.5">
    <rect x="62" y="226" width="108" height="34" rx="17" fill="#e7f0fd"/><text x="86" y="248" fill="#0b5cd5" font-weight="600">目录 OCR</text>
    <rect x="182" y="226" width="108" height="34" rx="17" fill="#e7f0fd"/><text x="200" y="248" fill="#0b5cd5" font-weight="600">秒级重扫</text>
    <rect x="302" y="226" width="108" height="34" rx="17" fill="#e7f0fd"/><text x="320" y="248" fill="#0b5cd5" font-weight="600">项目隔离</text>
    <rect x="62" y="272" width="108" height="34" rx="17" fill="#e7f0fd"/><text x="92" y="294" fill="#0b5cd5" font-weight="600">DWG 支持</text>
    <rect x="182" y="272" width="108" height="34" rx="17" fill="#e7f0fd"/><text x="206" y="294" fill="#0b5cd5" font-weight="600">双主题</text>
    <rect x="302" y="272" width="108" height="34" rx="17" fill="#e7f0fd"/><text x="326" y="294" fill="#0b5cd5" font-weight="600">清册导出</text>
  </g>
  <text x="64" y="352" font-size="15" fill="#5c6b7f">只读索引，绝不改动图纸文件 · 仅监听本机 · 绿色免安装</text>
  <text x="64" y="382" font-size="14" fill="#8a94a3">36 项自动化测试 · GitHub Actions CI · v2.4</text>

  <!-- 右侧：应用界面模拟（浅色主题窗口） -->
  <rect x="610" y="46" width="540" height="344" rx="14" fill="#dfe4eb"/>
  <g clip-path="url(#win-clip)">
    <rect x="616" y="52" width="528" height="332" rx="10" fill="#ffffff"/>
    <!-- 标题栏 -->
    <circle cx="638" cy="70" r="5" fill="#e5544b"/><circle cx="656" cy="70" r="5" fill="#f2b63c"/><circle cx="674" cy="70" r="5" fill="#4ad14e"/>
    <text x="880" y="75" font-size="12" fill="#5c6b7f" text-anchor="middle">工程图纸文件管理系统</text>
    <line x1="616" y1="86" x2="1144" y2="86" stroke="#dce2ea"/>
    <!-- 侧边栏 -->
    <rect x="616" y="87" width="132" height="297" fill="#f7f9fb"/>
    <text x="630" y="112" font-size="11.5" font-weight="600" fill="#1a2533">功能总览</text>
    <rect x="624" y="124" width="116" height="24" rx="6" fill="#e7f0fd"/>
    <text x="636" y="140" font-size="11.5" fill="#0b5cd5" font-weight="600">搜索</text>
    <text x="636" y="166" font-size="11.5" fill="#5c6b7f">扫描入库</text>
    <text x="636" y="194" font-size="11.5" fill="#5c6b7f">册列表</text>
    <text x="636" y="222" font-size="11.5" fill="#5c6b7f">版本对比</text>
    <text x="636" y="250" font-size="11.5" fill="#5c6b7f">图纸清册</text>
    <!-- 搜索行 -->
    <rect x="760" y="98" width="300" height="26" rx="6" fill="#ffffff" stroke="#dce2ea"/>
    <text x="772" y="115" font-size="11" fill="#8a94a3">搜图号、图名、册名…</text>
    <rect x="1066" y="98" width="66" height="26" rx="6" fill="#0b5cd5"/>
    <text x="1082" y="115" font-size="11" fill="#ffffff">搜 索</text>
    <!-- 结果卡 1 -->
    <rect x="760" y="140" width="372" height="122" rx="8" fill="#ffffff" stroke="#dce2ea"/>
    <text x="774" y="164" font-size="12.5" font-weight="700" fill="#1a2533">F10001-D0401-02</text>
    <rect x="908" y="150" width="64" height="18" rx="9" fill="#ddf3e4"/><text x="918" y="163" font-size="10.5" fill="#0d7a3e">2 个版本</text>
    <text x="774" y="186" font-size="12" fill="#1a2533">综合办公楼照明布置图</text>
    <text x="774" y="208" font-size="10.5" fill="#5c6b7f">D:\图纸\D0401【综合办公楼照明施工图】-2025.1.1</text>
    <rect x="774" y="220" width="88" height="20" rx="10" fill="#edf1f6"/><text x="786" y="234" font-size="10.5" fill="#5c6b7f">初版 2024.5</text>
    <rect x="870" y="220" width="120" height="20" rx="10" fill="#ddf3e4"/><text x="880" y="234" font-size="10.5" fill="#0d7a3e">最新 2025.3.9 修改</text>
    <!-- 结果卡 2 -->
    <rect x="760" y="274" width="372" height="88" rx="8" fill="#ffffff" stroke="#dce2ea"/>
    <text x="774" y="298" font-size="12.5" font-weight="700" fill="#1a2533">F10001-D0401-03</text>
    <text x="774" y="320" font-size="12" fill="#1a2533">泵房照明布置图</text>
    <text x="774" y="342" font-size="10.5" fill="#5c6b7f">D:\图纸\D0401【综合办公楼照明施工图】</text>
    <rect x="1096" y="286" width="24" height="18" rx="6" fill="#e7f0fd"/>
    <text x="774" y="356" font-size="0" fill="none"> </text>
  </g>
  <!-- 窗口描边 -->
  <rect x="616" y="52" width="528" height="332" rx="10" fill="none" stroke="#c9d2dd" stroke-width="1.5"/>
</svg>
