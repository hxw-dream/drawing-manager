<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图纸清册 · 工程图纸文件管理</title>
<script>if(localStorage.dm_theme==='dark')document.documentElement.classList.add('dark')</script>
<link rel="stylesheet" href="style.css?v=3">
<style>
  .statrow { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 140px; background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; padding: 12px 18px; text-align: center; }
  .stat b { display: block; font-size: 26px; color: var(--accent); }
  .stat span { color: var(--sub); font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--sub); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  td.no { font-family: Consolas, monospace; font-size: 12.5px; }
  .catcard > h3 .badge { font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>📋 图纸清册</h1>
  <nav><select id="projSel" class="projsel" title="切换项目"></select><div class="themeseg" id="themeSeg" role="group" aria-label="切换日间/夜间主题">
      <span class="segthumb" aria-hidden="true"></span>
      <button type="button" class="segopt" data-mode="light" aria-pressed="true" title="浅色主题">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>浅色</button>
      <button type="button" class="segopt" data-mode="dark" aria-pressed="false" title="深色主题">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>深色</button>
    </div><a href="index.html"><button>← 返回搜索</button></a></nav>
  <div style="flex:1"></div>
  <button id="exportBtn" class="primary">⬇ 导出 Excel</button>
</header>
<main>
  <div id="stats" class="statrow"></div>
  <div id="results"><div class="empty">加载中…</div></div>
</main>
<script src="common.js?v=2"></script><script src="inventory.js?v=2"></script>
</body>
</html>
