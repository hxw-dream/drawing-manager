<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工程图纸文件管理</title>
<script>if(localStorage.dm_theme==='dark')document.documentElement.classList.add('dark')</script>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header>
  <h1>📐 工程图纸文件管理</h1>
  <nav><select id="projSel" class="projsel" title="切换项目"></select><div class="themeseg" id="themeSeg" role="group" aria-label="切换日间/夜间主题">
      <span class="segthumb" aria-hidden="true"></span>
      <button type="button" class="segopt" data-mode="light" aria-pressed="true" title="浅色主题">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>浅色</button>
      <button type="button" class="segopt" data-mode="dark" aria-pressed="false" title="深色主题">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>深色</button>
    </div>
    <a href="volumes.html"><button>册列表</button></a>
    <a href="versions.html"><button>版本对比</button></a>
    <a href="inventory.html"><button>图纸清册</button></a>
  </nav>
  <div id="scanbox">
    <input id="root" placeholder="图纸根目录，如 D:\图纸库（扫描其下所有含 -ML 目录文件的册）">
    <button id="scanBtn" class="primary">扫描入库</button>
  </div>
</header>
<main>
  <div id="scanstatus"></div>
  <div id="scanissues"></div>
  <div id="searchrow">
    <input id="q" placeholder="搜图号、图名、册名、文件名… 字词不必连续，如：取水照明 / 泵房布置" autofocus>
    <button id="searchBtn" class="primary">搜索</button>
  </div>
  <div id="sortbar" style="display:none">
    <span class="meta">排序</span>
    <select id="sortKey">
      <option value="drawing_no">图号</option>
      <option value="date">修改日期</option>
      <option value="versions">同图号多版本</option>
    </select>
    <button id="sortDir">递增 ↑</button>
  </div>
  <div id="results"><div class="empty">输入关键字搜索，或先在上方填入根目录「扫描入库」。</div></div>
</main>
<script src="common.js?v=2"></script><script src="app.js?v=7"></script>
</body>
</html>
